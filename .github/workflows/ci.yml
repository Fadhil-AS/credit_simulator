name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit test
        run: mvn -B -ntp verify
      - name: Smoke test with input file
        run: ./credit_simulator file_inputs.txt
      - name: Verify docker image builds
        run: docker build -t credit-simulator:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: credit-simulator-jar
          path: credit-simulator-cli/target/credit-simulator.jar
